services:
  - type: web
    name: og-caps-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:generate
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: og-caps-db
          property: connectionString
databases:
  - name: og-caps-db
    databaseName: og_caps
    user: og_caps
    plan: free
    region: oregon
